<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroStay - Luxury Hotel Reservation System</title>
  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Files -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/rooms.css">
  <link rel="stylesheet" href="css/reservations.css">
  <link rel="stylesheet" href="css/guests.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">🏨</span>
        <span class="brand-name">AeroStay</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-link" data-page="dashboard">
          <span class="nav-icon">📊</span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a href="#" class="nav-link" data-page="rooms">
          <span class="nav-icon">🛏️</span>
          <span class="nav-text">Rooms</span>
        </a>
        <a href="#" class="nav-link" data-page="reservations">
          <span class="nav-icon">📅</span>
          <span class="nav-text">Reservations</span>
        </a>
        <a href="#" class="nav-link" data-page="guests">
          <span class="nav-icon">👤</span>
          <span class="nav-text">Guests</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <span class="version-label">v1.0.0</span>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="top-bar">
        <h1 id="page-title">Hotel Reservation System</h1>
        <div class="user-profile">
          <span class="avatar">👤</span>
          <span class="username">Manager</span>
        </div>
      </header>
      <div id="content-area" class="content-area">
        <!-- Page content loads here -->
      </div>
    </main>
  </div>

  <!-- Notification Area -->
  <div id="notification-area" class="notification-container"></div>

  <!-- Script Files -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/reservations.js"></script>
  <script src="js/guests.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
