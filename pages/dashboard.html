<div class="dashboard-header">
  <h2>Dashboard</h2>
</div>

<div class="dashboard-section" id="dashboard-room-stats">
  <h3 class="dashboard-section-title">Room Availability</h3>
  <div class="dashboard-stats-grid">
    <div class="dashboard-stat-card border-primary">
      <div class="dashboard-stat-label">Total Rooms</div>
      <div class="dashboard-stat-value text-primary" id="dashboard-stat-total-rooms">0</div>
    </div>
    <div class="dashboard-stat-card border-success">
      <div class="dashboard-stat-label">Available Today</div>
      <div class="dashboard-stat-value text-success" id="dashboard-stat-available">0</div>
    </div>
    <div class="dashboard-stat-card border-danger">
      <div class="dashboard-stat-label">Reserved Today</div>
      <div class="dashboard-stat-value text-danger" id="dashboard-stat-reserved">0</div>
    </div>
  </div>
</div>

<div class="dashboard-section" id="dashboard-res-stats">
  <!-- Placeholder for reservation stats -->
</div>

<div class="dashboard-section" id="dashboard-upcoming">
  <!-- Placeholder for upcoming arrivals -->
</div>
